# КОНТРОЛЬНАЯ ВЫБОРКА (роль 2): 122 сценария, 41 / 40 / 41. Собрана до настройки скоринга: первая
# версия дала 83%. Её ошибки разобраны и исправлены общими правками (справочник ОКПД2, доля по
# стоимости, «только …» → стоп-фактор), поэтому для новых правок выборка уже не контрольная.
#
# Дата оценки 2026-11-01 (as_of): сроки подачи у закупок позже — оценивать на эту дату, не на текущую.
# Восемь профилей: четыре прежних и четыре новых (продукты, клининг, мебель, дороги), которых система
# при настройке не видела. Закупки не пересекаются с scenarios.yaml и scenarios_draft.yaml.
#
# Разметка — детерминированная рубрика по тексту профиля, до запуска системы (код рубрики — в описании PR):
#   participate — предмет в специализации, регион свой, сумма в диапазоне, способ и закон подходят;
#   consider    — предмет в специализации, но одно-два мягких отклонения: чужой регион
#                 (регион — мягкое условие), сумма за границей не больше чем в 2 раза, другой способ;
#   skip        — предмет вне специализации (в т. ч. смежный), сумма за границей больше чем в 2 раза,
#                 нарушено жёсткое условие («только 44-ФЗ»), срок подачи истёк, заказчик ликвидирован.
# Предмет определялся ключевыми словами из текста профиля; спорные случаи просмотрены вручную
# (помечены «решение по предмету вручную»), сомнительные — исключены.

