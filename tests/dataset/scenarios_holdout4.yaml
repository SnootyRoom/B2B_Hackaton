# КОНТРОЛЬНАЯ ВЫБОРКА №4 — 15 НОВЫХ ОТРАСЛЕЙ (роль 2): 120 сценариев, 40 / 40 / 40.
# Собрана 31.10.2026. На ней скоринг НЕ настраивался.
#
# Дата оценки 2026-11-03 (as_of, 00:00 МСК): оценивать на эту дату, не на текущую.
# 15 новых профилей поставщиков, ни одна отрасль не встречалась в прошлых выборках: уголь и дрова,
# видеонаблюдение и СКУД, учебное оборудование, игрушки, отлов животных, организация мероприятий,
# юридические услуги, оценка имущества, кадастровые работы, поверка средств измерений, деловые поездки,
# СМИ и видеопроизводство, оборудование пищеблоков, приборы учёта, музыкальные инструменты.
# Сценариев на профиль: от 4 до 12 (юридических закупок в ЕИС сейчас почти нет).
# Закупки — реальные извещения ЕИС 2026 года (45 классов и 88 групп ОКПД2), разобраны исправленным
# парсером; не пересекаются с data/samples и прошлыми наборами; почти одинаковых предметов — не больше двух.
#
# Разметка — рубрика по тексту профиля, зафиксирована до сбора закупок и до запуска системы:
#   participate — предмет в специализации, регион свой (у удалённых услуг — юристы, оценка, поездки,
#                 учебное оборудование «по всей России» — регион не важен), сумма в диапазоне, способ и
#                 закон подходят;
#   consider    — предмет в специализации, но одно-два мягких отклонения: чужой регион, сумма за
#                 границей не больше чем в 2 раза, другой способ;
#   skip        — предмет вне специализации, в т. ч. смежный и прямо исключённый в профиле («ремонтом и
#                 обслуживанием не занимаемся», «поверкой не занимаемся», «сами приборы не продаём»,
#                 «монтажом площадок не занимаемся»), сумма за границей больше чем в 2 раза, нарушено
#                 жёсткое условие («только 44-ФЗ», «работаем только в Свердловской области»), три мягких
#                 отклонения, срок подачи истёк.
# Новое по сравнению с прошлыми выборками: жёсткое условие по региону и прямые исключения в тексте профиля.
# Предмет определялся ключевыми словами; до запуска системы уточнены слова у учебного оборудования,
# музыкальных инструментов и деловых поездок; при просмотре отбора явные промахи помечены «решение по
# предмету вручную» (3), сомнительные закупки исключены — в том числе со сроком подачи ближе 3 ч к
# дате оценки и с НМЦК 0.
# Открытых профильных закупок в своём регионе в ЕИС не нашлось у профилей «уголь», «игрушки», «СМИ»,
# «приборы учёта» — у них «участвовать» нет, класс добран за счёт других
# профилей (свой регион искали и по коду региона в номере извещения 44-ФЗ).

