profiles:
  q01_coal:
    text: 'ООО «КузбассУгольСбыт» из Кемеровской области. Поставляем каменный и бурый уголь, дрова и топливные брикеты
      для котельных школ, больниц и ЖКХ. Интересны аукционы и запросы котировок от 200 тыс. до 30 млн руб.

      '
  q02_video:
    text: 'ООО «БашВидеоСервис» из Республики Башкортостан. Монтируем и обслуживаем системы видеонаблюдения, контроля
      и управления доступом (СКУД), домофоны. Интересны аукционы и запросы котировок от 100 тыс. до 15 млн руб.

      '
  q03_school:
    text: 'Компания «Школьный мир» из Москвы. Поставляем (без ремонта и обслуживания) учебное оборудование для школ
      и детских садов: учебно-наглядные пособия, оборудование кабинетов физики, химии и биологии, цифровые лаборатории,
      наборы по робототехнике, оснащение центров «Точка роста». Работаем по всей России, регион не важен. Интересны
      аукционы от 300 тыс. до 30 млн руб.

      '
  q04_toys:
    text: 'ООО «Игрушкин» из Нижегородской области. Поставляем игрушки, развивающие и настольные игры, конструкторы,
      игровое оборудование и наборы для детских садов (монтажом площадок не занимаемся). Участвуем только в закупках
      по 44-ФЗ, интересны аукционы и запросы котировок от 50 тыс. до 5 млн руб.

      '
  q05_animals:
    text: 'ООО «ДругЗверь» из Свердловской области. Отлавливаем, содержим в приюте, вакцинируем и стерилизуем животных
      без владельцев по заказам муниципалитетов. Работаем только в Свердловской области. Интересны закупки от 50
      тыс. до 5 млн руб.

      '
  q06_events:
    text: 'Event-агентство «Праздник на Неве» из Санкт-Петербурга. Организуем и проводим под ключ праздники, концерты,
      фестивали, конференции, форумы, выставки и городские мероприятия. Интересны конкурсы, аукционы и запросы предложений
      от 200 тыс. до 20 млн руб.

      '
  q07_legal:
    text: 'Юридическая фирма «Право и Порядок». Оказываем юридические услуги: представительство в судах и арбитраже,
      претензионно-исковая работа, правовая экспертиза документов, сопровождение банкротства. Работаем дистанционно
      по всей России. Интересны закупки от 50 тыс. до 5 млн руб.

      '
  q08_appraisal:
    text: 'Оценочная компания «ЭкспертОценка». Определяем рыночную стоимость недвижимости, земельных участков, транспорта,
      права аренды и бизнеса, оцениваем ущерб. Работаем по всей России. Интересны закупки от 20 тыс. до 3 млн руб.

      '
  q09_cadastral:
    text: 'Кадастровый центр «ТатГеоПлан» из Республики Татарстан. Выполняем кадастровые работы: межевание земельных
      участков, технические планы зданий и сооружений, комплексные кадастровые работы, топографическую съёмку. Работаем
      только по 44-ФЗ; интересны закупки от 50 тыс. до 10 млн руб.

      '
  q10_metrology:
    text: 'ООО «ПермьМетрология» из Пермского края. Поверяем и калибруем средства измерений: весы, манометры, счётчики,
      медицинские и лабораторные приборы; аттестуем испытательное оборудование. Сами приборы не продаём. Интересны
      запросы котировок и аукционы от 30 тыс. до 3 млн руб.

      '
  q11_travel:
    text: 'Агентство деловых поездок «ТрэвелСервис» из Москвы. Организуем служебные командировки: бронируем и оформляем
      авиа- и железнодорожные билеты, гостиницы, трансферы. Работаем по всей России. Интересны закупки от 100 тыс.
      до 20 млн руб.

      '
  q12_media:
    text: 'Медиахолдинг «Южный Урал Медиа» из Челябинской области — телеканал, радио и студия видеопроизводства.
      Освещаем деятельность органов власти в СМИ, изготавливаем и размещаем видеоролики и телесюжеты, ведём социальные
      сети учреждений. Интересны закупки от 100 тыс. до 10 млн руб.

      '
  q13_kitchen:
    text: 'ООО «ПодмосковьеПищеМаш» из Московской области. Поставляем и монтируем технологическое оборудование для
      пищеблоков и столовых: плиты, пароконвектоматы, холодильные шкафы, посудомоечные машины, а также кухонную
      посуду и инвентарь. Ремонтом и обслуживанием оборудования не занимаемся. Интересны аукционы от 100 тыс. до
      15 млн руб.

      '
  q14_meters:
    text: 'ООО «ДонУчёт» из Ростовской области. Поставляем и устанавливаем приборы учёта воды, тепла, газа и электроэнергии,
      монтируем узлы учёта тепловой энергии и автоматизированные системы учёта (АСКУЭ). Поверкой и обслуживанием
      не занимаемся. Интересны аукционы и запросы котировок от 50 тыс. до 10 млн руб.

      '
  q15_music:
    text: 'Магазин «Камертон» из Москвы. Поставляем музыкальные инструменты (фортепиано, баяны, народные, духовые
      и ударные), звуковое и световое сценическое оборудование для школ искусств и домов культуры. Интересны аукционы
      от 100 тыс. до 10 млн руб.

      '
