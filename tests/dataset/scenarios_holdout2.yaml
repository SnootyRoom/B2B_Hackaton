# КОНТРОЛЬНАЯ ВЫБОРКА №2 (роль 2): 120 сценариев, 40 / 41 / 39. Собрана 31.10.2026 после того,
# как первая (scenarios_holdout.yaml) была использована для настройки. На ней скоринг НЕ настраивался.
#
# Дата оценки 2026-11-01 (as_of, 00:00 МСК): оценивать на эту дату, не на текущую.
# Восемь профилей: четыре организаторов и четыре новых (охрана, лекарства «только 44-ФЗ», разработка ПО
# «по всей России», спецодежда), которых система не видела ни при настройке, ни в прошлых выборках.
# Все закупки — реальные извещения ЕИС 2026 года, не пересекаются с data/samples и прошлыми наборами.
#
# Разметка — рубрика по тексту профиля, зафиксирована до сбора закупок и до запуска системы:
#   participate — предмет в специализации, регион свой (у ПО регион не важен), сумма в диапазоне,
#                 способ и закон подходят;
#   consider    — предмет в специализации, но одно-два мягких отклонения: чужой регион, сумма за
#                 границей не больше чем в 2 раза, другой способ;
#   skip        — предмет вне специализации (в т. ч. смежный: проектирование для стройки, лицензии для
#                 разработчика ПО, обслуживание вместо поставки), сумма за границей больше чем в 2 раза,
#                 нарушено «только 44-ФЗ», три мягких отклонения сразу, срок подачи истёк.
# Предмет определялся ключевыми словами; при просмотре отбора (без запуска системы) исправлены ошибки
# ключевых слов («цод» внутри «спецодежды», предлог «по» как «ПО»), явные промахи помечены «решение по
# предмету вручную», сомнительные закупки исключены. Почти одинаковых предметов — не больше двух.
# Для канцтоваров, IT-интегратора и спецодежды открытых закупок в своём регионе в ЕИС не нашлось:
# «участвовать» собрано по пяти профилям.
# После первого прогона (97/120 = 81%) при разборе ошибок найдена одна ошибка разметки: g093 (реагенты
# для анализатора) — профиль медицины, «рассмотреть», а не «пропустить». Других правок нет.

as_of: '2026-11-01'
profiles:
  profile_a_construction_company:
    text: 'Мы опытная строительная компания из Московской области "СтройРегион-Инвест". Специализация: строительство
      школ, детсадов, административных зданий, кровельные и восстановительные работы. Есть СРО, собственная техника,
      120 сотрудников. Годовая выручка 350 млн руб. Интересны конкурсы и аукционы на строительные работы от 5 до
      50 млн руб.

      '
  profile_b_office_supplies:
    text: 'Мы маленькая компания "Вектор" из Тверской области. Специализация: поставка канцтоваров, мелкий ремонт
      офисов. 4 сотрудника, годовая выручка 12 млн руб. Опыт в госзакупках 1.5 года, 3 контракта. Нет СРО на строительство.
      Интересны небольшие запросы котировок до 2 млн руб.

      '
  profile_c_medical_suppliers:
    text: 'Мы компания "МедТехСнаб" из Камчатского края. Специализация: поставка медицинского оборудования, лабораторных
      реагентов и расходных материалов для государственных больниц. Годовая выручка 80 млн руб. Интересны закупки
      от 500 тыс. до 30 млн руб. Работаем только по 44-ФЗ.

      '
  profile_d_it:
    text: 'Мы IT-интегратор "ПримТех" из Приморского края. Специализация: комплексная поставка и монтаж IT-инфраструктуры,
      включая серверное оборудование, системы хранения данных (СХД), прокладку ВОЛС и монтаж камер видеонаблюдения.
      Есть опыт пусконаладки оборудования в ЦОД, все необходимые лицензии и допуски СРО. Годовая выручка 150 млн
      руб. Интересны закупки от 5 млн до 100 млн руб. Готовы предоставить гарантию на оборудование от 24 месяцев.

      '
  profile_i_security:
    text: 'Частная охранная организация "Щит" из Республики Татарстан. Оказываем услуги физической и пультовой охраны
      объектов, монтируем и обслуживаем охранно-пожарную сигнализацию. Есть лицензия Росгвардии, 300 сотрудников.
      Интересны конкурсы и аукционы от 1 до 30 млн руб.

      '
  profile_j_pharma:
    text: 'ООО "ДонФарм" из Ростовской области — дистрибьютор лекарственных препаратов. Поставляем лекарственные
      препараты в больницы и поликлиники. Интересны аукционы от 300 тыс. до 20 млн руб. Работаем только по 44-ФЗ.

      '
  profile_k_software:
    text: 'Компания "СибСофт" из Новосибирска. Разрабатываем, внедряем и сопровождаем программное обеспечение и
      информационные системы, оказываем техническую поддержку пользователей. Работаем с заказчиками по всей России.
      Интересны закупки от 300 тыс. до 10 млн руб.

      '
  profile_l_workwear:
    text: 'ООО "ТекстильПро" из Ивановской области. Шьём и поставляем спецодежду, форменную одежду, средства индивидуальной
      защиты (перчатки, спецобувь), постельное бельё для больниц. Интересны аукционы и запросы котировок от 200
      тыс. до 5 млн руб.

      '
