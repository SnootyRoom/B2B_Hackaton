# Тестовые сценарии для скоринга закупок (Роль 5)
profiles:
  profile_a_construction_company:
    text: >
      Мы опытная строительная компания из Московской области "СтройРегион-Инвест".
      Специализация: строительство школ, детсадов, административных зданий,
      кровельные и восстановительные работы. Есть СРО, собственная техника, 120 сотрудников.
      Годовая выручка 350 млн руб. Интересны конкурсы и аукционы на строительные работы
      от 5 до 50 млн руб.

  profile_b_office_supplies:
    text: >
      Мы маленькая компания "Вектор" из Тверской области. Специализация: поставка
      канцтоваров, мелкий ремонт офисов. 4 сотрудника, годовая выручка 12 млн руб.
      Опыт в госзакупках 1.5 года, 3 контракта. Нет СРО на строительство.
      Интересны небольшие запросы котировок до 2 млн руб.
  
  profile_c_medical_suppliers:
    text: >
      Мы компания "МедТехСнаб" из Камчатского края. Специализация: поставка 
      медицинского оборудования, лабораторных реагентов и расходных материалов 
      для государственных больниц. Годовая выручка 80 млн руб. 
      Интересны закупки от 500 тыс. до 30 млн руб. Работаем только по 44-ФЗ.

  profile_d_it:
    text: >
      Мы IT-интегратор "ПримТех" из Приморского края. Специализация: комплексная поставка 
      и монтаж IT-инфраструктуры, включая серверное оборудование, системы хранения данных (СХД), 
      прокладку ВОЛС и монтаж камер видеонаблюдения. Есть опыт пусконаладки оборудования в ЦОД,
      все необходимые лицензии и допуски СРО. Годовая выручка 150 млн руб. Интересны закупки от 5 млн до 100 млн руб. 
      Готовы предоставить гарантию на оборудование от 24 месяцев.

scenarios:
