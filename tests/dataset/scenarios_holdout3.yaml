# КОНТРОЛЬНАЯ ВЫБОРКА №3 — РАЗНООБРАЗИЕ ОКПД2 (роль 2): 240 сценариев, 80 / 80 / 80.
# Собрана 31.10.2026. На ней скоринг НЕ настраивался.
#
# Дата оценки 2026-11-01 (as_of, 00:00 МСК): оценивать на эту дату, не на текущую.
# 30 новых профилей поставщиков — каждый из своей отрасли: топливо, хлеб, питание, отходы, перевозки,
# полиграфия, связь, оргтехника, автомобили, автосервис, электротовары, отопление и вентиляция, лифты,
# ремонт медтехники, хозтовары, книги, обучение, страхование, аудит, проектирование, пожарная
# безопасность, медосмотры, спортинвентарь, питьевая вода, озеленение, дезинсекция, автозапчасти,
# прачечная, стройматериалы, овощи. Ни один профиль не встречался в прошлых выборках.
# Закупки — реальные извещения ЕИС 2026 года (48 классов и 165 групп ОКПД2), не пересекаются с
# data/samples и прошлыми наборами; почти одинаковых предметов — не больше двух; при отборе
# предпочтение — закупкам с группой ОКПД2, которой ещё нет в выборке.
#
# Разметка — рубрика по тексту профиля, зафиксирована до сбора закупок и до запуска системы:
#   participate — предмет в специализации, регион свой (у удалённых услуг — книги, обучение,
#                 страхование, аудит — регион не важен), сумма в диапазоне, способ и закон подходят;
#   consider    — предмет в специализации, но одно-два мягких отклонения: чужой регион, сумма за
#                 границей не больше чем в 2 раза, другой способ;
#   skip        — предмет вне специализации (в т. ч. смежный: поставка вместо услуги и наоборот,
#                 запчасти вместо автомобилей, проектирование вместо работ), сумма за границей больше
#                 чем в 2 раза, нарушено «только 44-ФЗ», три мягких отклонения, срок подачи истёк.
# Предмет определялся ключевыми словами; при просмотре отбора (без запуска системы) явные промахи
# помечены «решение по предмету вручную», сомнительные закупки исключены.
# Для электротоваров (Челябинск) открытых закупок в своём регионе не нашлось; у ряда профилей
# «участвовать» меньше трёх — класс добран за счёт других профилей.
# Разметка сверена с парсером после правки сроков 223-ФЗ (местное время заказчика): ни один срок не
# перешёл через дату оценки, метки не изменились.

