server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # Лимит архива из .env.example (UPLOAD_MAX_ARCHIVE_MB=100) с запасом на пакет файлов
    client_max_body_size 110m;

    # /api/... → сервис backend из docker-compose.yml, порт 8000
    location /api/ {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Синхронные эндпоинты отвечают < 2 с (NFR-3); запас — для приёма больших файлов
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
    }

    # Адреса React Router (/results, /procurements/5) отдают index.html
    location / {
        try_files $uri $uri/ /index.html;
    }
}
